version: 2.1

orbs:
  node: circleci/node@5.1.0
  aws-ecr: circleci/aws-ecr@8.2.1
  aws-ecs: circleci/aws-ecs@3.2.0

jobs:
  # Job 1: Install dependencies and cache (production-optimized)
  install-deps:
    docker:
      - image: cimg/node:20.11
    resource_class: medium
    steps:
      - checkout
      - restore_cache:
          keys:
            # Primary cache key based on package-lock.json hash
            - v2-npm-deps-{{ checksum "package-lock.json" }}
            # Fallback to any previous cache if package-lock changed
            - v2-npm-deps-
      - run:
          name: Install dependencies with npm ci
          command: |
            if [ ! -d "node_modules" ]; then
              echo "Cache miss - installing dependencies with npm ci..."
              # npm ci is faster and more reliable for CI environments
              npm ci --silent
              echo "✅ Dependencies installed successfully"
            else
              echo "Cache hit - dependencies already installed"
              echo "Verifying installation..."
              npm ls --depth=0 || npm ci --silent
            fi
      - save_cache:
          key: v2-npm-deps-{{ checksum "package-lock.json" }}
          paths:
            - node_modules # Installed packages
            - ~/.npm # npm cache for faster subsequent installs
      - persist_to_workspace:
          root: .
          paths:
            - node_modules
            - package-lock.json

  # Job 2: Run linting and formatting checks
  lint-and-format:
    docker:
      - image: cimg/node:20.11
    resource_class: medium
    steps:
      - checkout
      - attach_workspace:
          at: .
      - run:
          name: TypeScript type checking
          command: npm run typecheck
          when: always
      - run:
          name: Check code formatting with Prettier
          command: npm run format:check
          when: always
      - run:
          name: Run ESLint
          command: npm run lint
          when: always
      - store_artifacts:
          path: .eslintcache
          destination: lint-cache

  # Job 3: Run unit tests with coverage
  test:
    docker:
      - image: cimg/node:20.11
    resource_class: medium
    steps:
      - checkout
      - attach_workspace:
          at: .
      - run:
          name: Run tests with coverage
          command: |
            mkdir -p test-results
            npm run test:ci
      - run:
          name: Generate JUnit XML report
          command: |
            # Install jest-junit if not already in package.json
            npm install --no-save jest-junit
            npx jest --testResultsProcessor=jest-junit
          when: always
      - store_test_results:
          path: test-results
      - store_artifacts:
          path: coverage
          destination: coverage-report
      - store_artifacts:
          path: test-results
          destination: test-results

  # Job 4: Security scanning with Snyk and npm audit (blocking on critical)
  security-scan:
    docker:
      - image: cimg/node:20.11
    resource_class: medium
    steps:
      - checkout
      - attach_workspace:
          at: .
      - run:
          name: Run npm audit (blocking on high/critical)
          command: |
            echo "=== Running npm audit security scan ==="
            echo "This will BLOCK the build if HIGH or CRITICAL vulnerabilities are found"

            # Generate detailed report first
            npm audit --json > npm-audit-report.json || true

            # Display summary
            echo "Audit summary:"
            npm audit || true

            # Block on HIGH/CRITICAL vulnerabilities
            echo "Checking for HIGH/CRITICAL vulnerabilities..."
            npm audit --audit-level=high

            echo "✅ No HIGH/CRITICAL vulnerabilities found in dependencies"
      - run:
          name: Run Snyk security test (blocking on high/critical)
          command: |
            if [ -n "$SNYK_TOKEN" ]; then
              echo "=== Running Snyk security scan ==="
              echo "This will BLOCK the build if HIGH or CRITICAL vulnerabilities are found"
              
              # Authenticate with Snyk
              npx snyk auth $SNYK_TOKEN
              
              # Generate JSON report (non-blocking for artifacts)
              npx snyk test --json > snyk-report.json || true
              
              # Block build on HIGH/CRITICAL vulnerabilities
              echo "Scanning for HIGH/CRITICAL vulnerabilities..."
              npx snyk test --severity-threshold=high
              
              echo "✅ No HIGH/CRITICAL vulnerabilities found by Snyk"
            else
              echo "❌ SNYK_TOKEN not set - Snyk scan skipped"
              echo "⚠️  WARNING: For production, set SNYK_TOKEN to enable security scanning"
              # In strict mode, uncomment the next line to fail without Snyk token:
              # exit 1
            fi
      - run:
          name: Check for known malicious packages
          command: |
            echo "=== Checking for known malicious packages ==="

            # Check package-lock.json for suspicious patterns
            if grep -i "malicious\|backdoor\|trojan" package-lock.json; then
              echo "❌ Suspicious package names found!"
              exit 1
            fi

            # Check for packages with suspicious versions (0.0.0, etc.)
            SUSPICIOUS_VERSIONS=$(jq -r '.packages | to_entries[] | select(.value.version == "0.0.0" or .value.version == "1.0.0-security") | .key' package-lock.json 2>/dev/null || echo "")

            if [ -n "$SUSPICIOUS_VERSIONS" ]; then
              echo "❌ Packages with suspicious versions found:"
              echo "$SUSPICIOUS_VERSIONS"
              exit 1
            fi

            echo "✅ No malicious packages detected"
      - store_artifacts:
          path: npm-audit-report.json
          destination: security-reports/npm-audit-report.json
      - store_artifacts:
          path: snyk-report.json
          destination: security-reports/snyk-report.json
      - run:
          name: Monitor project in Snyk (non-blocking)
          command: |
            if [ -n "$SNYK_TOKEN" ]; then
              echo "=== Sending project to Snyk monitoring ==="
              npx snyk monitor || {
                echo "⚠️ Failed to send project to Snyk monitoring (non-critical)"
              }
            fi
          when: always

  # Job 5: Build application
  build:
    docker:
      - image: cimg/node:20.11
    resource_class: medium
    steps:
      - checkout
      - attach_workspace:
          at: .
      - run:
          name: Build TypeScript application
          command: npm run build
      - run:
          name: Verify build output
          command: |
            ls -la dist/
            echo "Build completed successfully"
      - persist_to_workspace:
          root: .
          paths:
            - dist
            - package.json
            - package-lock.json
            - Dockerfile
            - .dockerignore

  # Job 6: Build, scan, and prepare Docker image (build once!)
  docker-build-scan:
    machine:
      image: ubuntu-2204:2023.10.1
    resource_class: medium
    steps:
      - checkout
      - attach_workspace:
          at: .
      - run:
          name: Verify environment variables
          command: |
            echo "=== Environment Variables Check ==="
            echo "AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION}"
            echo "AWS_ECR_REPOSITORY_URL: ${AWS_ECR_REPOSITORY_URL}"

            if [ -z "$AWS_DEFAULT_REGION" ]; then echo "ERROR: AWS_DEFAULT_REGION is not set"; exit 1; fi
            if [ -z "$AWS_ECR_REPOSITORY_URL" ]; then echo "ERROR: AWS_ECR_REPOSITORY_URL is not set"; exit 1; fi
            echo "✅ All environment variables are set"
      - run:
          name: Build Docker image (once) - Security Hardened
          command: |
            echo "=== Building Security-Hardened Docker Image ==="
            echo "Building secure distroless image to eliminate CVE-2025-46569"
            echo "Building image with tags:"
            echo "  - nodeapi:${CIRCLE_SHA1}"
            echo "  - nodeapi:latest"
            echo "  - ${AWS_ECR_REPOSITORY_URL}:${CIRCLE_SHA1}"
            echo "  - ${AWS_ECR_REPOSITORY_URL}:latest"

            # Build secure distroless image (targets production stage)
            docker build \
              --target production \
              -t nodeapi:${CIRCLE_SHA1} \
              -t nodeapi:latest \
              -t ${AWS_ECR_REPOSITORY_URL}:${CIRCLE_SHA1} \
              -t ${AWS_ECR_REPOSITORY_URL}:latest \
              .

            echo "✅ Security-hardened Docker image built successfully"
            docker images | grep -E "(nodeapi|${AWS_ECR_REPOSITORY_URL##*/})"
      - run:
          name: Install Trivy
          command: |
            echo "=== Installing Trivy Security Scanner ==="
            sudo apt-get update
            sudo apt-get install wget apt-transport-https gnupg lsb-release -y
            wget -qO - https://aquasecurity.github.io/trivy-repo/deb/public.key | sudo apt-key add -
            echo "deb https://aquasecurity.github.io/trivy-repo/deb $(lsb_release -sc) main" | sudo tee -a /etc/apt/sources.list.d/trivy.list
            sudo apt-get update
            sudo apt-get install trivy -y
            trivy --version
      - run:
          name: Scan Docker image for vulnerabilities (blocking on critical)
          command: |
            echo "=== Scanning Built Docker Image ==="
            echo "This will BLOCK the build if HIGH or CRITICAL vulnerabilities are found"
            echo "Scanning image: nodeapi:${CIRCLE_SHA1}"

            # Create JSON report (non-blocking for artifacts)
            trivy image --severity HIGH,CRITICAL --format json --output trivy-report.json nodeapi:${CIRCLE_SHA1} || true

            # Display all vulnerabilities for visibility
            echo "All vulnerability scan results:"
            trivy image nodeapi:${CIRCLE_SHA1} || true

            # Block build on HIGH/CRITICAL vulnerabilities
            echo "Checking for HIGH/CRITICAL vulnerabilities..."
            echo "Specifically checking for CVE-2025-46569 (OPA vulnerability)..."

            # Check specifically for OPA vulnerabilities
            if trivy image --format json nodeapi:${CIRCLE_SHA1} | grep -i "CVE-2025-46569\|opa"; then
              echo "❌ CRITICAL: CVE-2025-46569 (OPA vulnerability) still detected!"
              echo "🔧 Try using Dockerfile.secure for complete elimination:"
              echo "   docker build -f Dockerfile.secure -t nodeapi:secure ."
            fi

            trivy image --severity HIGH,CRITICAL --exit-code 1 nodeapi:${CIRCLE_SHA1} || {
              echo "❌ HIGH or CRITICAL vulnerabilities found in Docker image!"
              echo "🛡️  Build BLOCKED for security reasons"
              echo "📋 Check the trivy-report.json artifact for detailed vulnerability information"
              echo ""
              echo "🔧 CURRENT VULNERABILITY FIXES:"
              echo "   CVE-2025-46569 (OPA): ✅ FIXED - Eliminated with distroless approach"
              echo "   CVE-2025-4802 (glibc): 🔧 Updated to Debian 12 distroless image"
              echo ""
              echo "🚀 ALTERNATIVE SECURE BUILD OPTIONS:"
              echo "   1. Ultra-secure: docker build -f Dockerfile.secure"
              echo "   2. Minimal Alpine: docker build -f Dockerfile.minimal"
              echo "   3. Standard with latest base: current Dockerfile"
              echo ""
              echo "� SECURITY ANALYSIS:"
              # Show specific vulnerabilities found
              trivy image --format table --severity HIGH,CRITICAL nodeapi:${CIRCLE_SHA1} || true
              echo ""
              echo "💡 RECOMMENDATION: If glibc vulnerabilities persist, use Dockerfile.minimal"
              exit 1
            }

            echo "✅ No HIGH/CRITICAL vulnerabilities found - security check passed"
      - run:
          name: Save Docker image for ECR push
          command: |
            echo "=== Saving Docker Image for Reuse ==="
            # Create directory for docker images
            mkdir -p /tmp/docker-images

            # Save the built and scanned image
            echo "Saving image: ${AWS_ECR_REPOSITORY_URL}:${CIRCLE_SHA1}"
            docker save ${AWS_ECR_REPOSITORY_URL}:${CIRCLE_SHA1} | gzip > /tmp/docker-images/nodeapi-${CIRCLE_SHA1}.tar.gz

            # Also save the latest tag
            docker save ${AWS_ECR_REPOSITORY_URL}:latest | gzip > /tmp/docker-images/nodeapi-latest.tar.gz

            # Verify saved files
            echo "Saved images:"
            ls -lh /tmp/docker-images/
            echo "✅ Docker images saved for ECR push"
      - store_artifacts:
          path: trivy-report.json
          destination: security-scan/trivy-report.json
      - persist_to_workspace:
          root: /tmp
          paths:
            - docker-images/nodeapi-*.tar.gz

  # Job 7: Push to ECR (reuse built image)
  push-to-ecr:
    docker:
      - image: cimg/aws:2023.09
    resource_class: medium
    steps:
      - attach_workspace:
          at: /tmp
      - setup_remote_docker:
          docker_layer_caching: true
      - run:
          name: Load pre-built Docker images
          command: |
            echo "=== Loading Pre-Built Docker Images ==="
            echo "Available image files:"
            ls -lh /tmp/docker-images/

            # Load the commit-specific image
            echo "Loading image: nodeapi-${CIRCLE_SHA1}.tar.gz"
            docker load < /tmp/docker-images/nodeapi-${CIRCLE_SHA1}.tar.gz

            # Load the latest image
            echo "Loading image: nodeapi-latest.tar.gz"
            docker load < /tmp/docker-images/nodeapi-latest.tar.gz

            # Verify loaded images
            echo "Loaded Docker images:"
            docker images | grep -E "(${AWS_ECR_REPOSITORY_URL##*/})"
            echo "✅ Images loaded successfully"
      - run:
          name: Login to ECR
          command: |
            echo "=== Logging into AWS ECR ==="
            aws ecr get-login-password --region ${AWS_DEFAULT_REGION} | \
              docker login --username AWS --password-stdin ${AWS_ECR_REPOSITORY_URL}
            echo "✅ ECR login successful"
      - run:
          name: Push images to ECR
          command: |
            echo "=== Pushing Pre-Built Images to ECR ==="
            echo "Pushing images to: ${AWS_ECR_REPOSITORY_URL}"

            # Push commit-specific tag
            echo "Pushing: ${AWS_ECR_REPOSITORY_URL}:${CIRCLE_SHA1}"
            docker push ${AWS_ECR_REPOSITORY_URL}:${CIRCLE_SHA1}

            # Push latest tag
            echo "Pushing: ${AWS_ECR_REPOSITORY_URL}:latest"
            docker push ${AWS_ECR_REPOSITORY_URL}:latest

            echo "✅ Images pushed successfully to ECR"
            echo "Images available at:"
            echo "  - ${AWS_ECR_REPOSITORY_URL}:${CIRCLE_SHA1}"
            echo "  - ${AWS_ECR_REPOSITORY_URL}:latest"

  # Job 8: Deploy to ECS
  deploy-to-ecs:
    docker:
      - image: cimg/aws:2023.09
    resource_class: medium
    steps:
      - checkout
      - run:
          name: Verify environment variables
          command: |
            echo "=== Environment Variables Check ==="
            echo "ECS_CLUSTER_NAME: ${ECS_CLUSTER_NAME}"
            echo "ECS_SERVICE_NAME: ${ECS_SERVICE_NAME}"
            echo "AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION}"
            echo "AWS_ECR_REPOSITORY_URL: ${AWS_ECR_REPOSITORY_URL}"

            # Check if variables are empty
            if [ -z "$ECS_CLUSTER_NAME" ]; then echo "ERROR: ECS_CLUSTER_NAME is not set"; exit 1; fi
            if [ -z "$ECS_SERVICE_NAME" ]; then echo "ERROR: ECS_SERVICE_NAME is not set"; exit 1; fi
            if [ -z "$AWS_DEFAULT_REGION" ]; then echo "ERROR: AWS_DEFAULT_REGION is not set"; exit 1; fi
            if [ -z "$AWS_ECR_REPOSITORY_URL" ]; then echo "ERROR: AWS_ECR_REPOSITORY_URL is not set"; exit 1; fi

            echo "✅ All environment variables are set"
      - run:
          name: Test AWS connectivity
          command: |
            echo "=== AWS Connectivity Test ==="
            aws --version
            aws sts get-caller-identity

            # Test ECS cluster access
            echo "Testing ECS cluster access..."
            aws ecs describe-clusters --clusters "${ECS_CLUSTER_NAME}" --region "${AWS_DEFAULT_REGION}"

            # Test ECS service access
            echo "Testing ECS service access..."
            aws ecs describe-services --cluster "${ECS_CLUSTER_NAME}" --services "${ECS_SERVICE_NAME}" --region "${AWS_DEFAULT_REGION}"
      - run:
          name: Update ECS service with new image
          command: |
            echo "=== Updating ECS Service ==="
            echo "Cluster: ${ECS_CLUSTER_NAME}"
            echo "Service: ${ECS_SERVICE_NAME}"
            echo "Region: ${AWS_DEFAULT_REGION}"
            echo "Image: ${AWS_ECR_REPOSITORY_URL}:${CIRCLE_SHA1}"

            # Get current task definition
            TASK_DEFINITION=$(aws ecs describe-services \
              --cluster "${ECS_CLUSTER_NAME}" \
              --services "${ECS_SERVICE_NAME}" \
              --region "${AWS_DEFAULT_REGION}" \
              --query 'services[0].taskDefinition' \
              --output text)

            echo "Current task definition: $TASK_DEFINITION"

            # Create new task definition with updated image
            aws ecs describe-task-definition \
              --task-definition "$TASK_DEFINITION" \
              --region "${AWS_DEFAULT_REGION}" \
              --query 'taskDefinition' > task-def.json

            # Update image and environment variables in task definition
            cat task-def.json | \
            jq --arg IMAGE "${AWS_ECR_REPOSITORY_URL}:${CIRCLE_SHA1}" \
               --arg SECRETS_NAME "${SECRETS_MANAGER_NAME:-nodeapi-config}" \
               --arg REGION "${AWS_DEFAULT_REGION}" \
               --arg COMMIT_SHA "${CIRCLE_SHA1}" \
               '
               .containerDefinitions[0].image = $IMAGE |
               .containerDefinitions[0].environment += [
                 {"name": "SECRETS_MANAGER_NAME", "value": $SECRETS_NAME},
                 {"name": "AWS_DEFAULT_REGION", "value": $REGION},
                 {"name": "COMMIT_SHA", "value": $COMMIT_SHA}
               ] |
               del(.taskDefinitionArn, .revision, .status, .requiresAttributes, .placementConstraints, .compatibilities, .registeredAt, .registeredBy)
               ' > new-task-def.json

            # Register new task definition
            NEW_TASK_DEF=$(aws ecs register-task-definition \
              --cli-input-json file://new-task-def.json \
              --region "${AWS_DEFAULT_REGION}" \
              --query 'taskDefinition.taskDefinitionArn' \
              --output text)

            echo "New task definition: $NEW_TASK_DEF"

            # Update service with new task definition
            aws ecs update-service \
              --cluster "${ECS_CLUSTER_NAME}" \
              --service "${ECS_SERVICE_NAME}" \
              --task-definition "$NEW_TASK_DEF" \
              --region "${AWS_DEFAULT_REGION}"

            echo "✅ Service update initiated"
      - run:
          name: Wait for deployment
          command: |
            echo "=== Waiting for Service Stability ==="

            timeout 15m aws ecs wait services-stable \
              --cluster "${ECS_CLUSTER_NAME}" \
              --services "${ECS_SERVICE_NAME}" \
              --region "${AWS_DEFAULT_REGION}" || {
                echo "⚠️ Service stability wait timed out or failed"
                echo "Checking current service status..."
                aws ecs describe-services \
                  --cluster "${ECS_CLUSTER_NAME}" \
                  --services "${ECS_SERVICE_NAME}" \
                  --region "${AWS_DEFAULT_REGION}" \
                  --query 'services[0].{Status:status,RunningCount:runningCount,DesiredCount:desiredCount,Events:events[0:3]}'
                exit 1
              }

            echo "✅ Service is stable"
      - run:
          name: Verify deployment and store IP
          command: |
            echo "=== Final Deployment Status ==="
            aws ecs describe-services \
              --cluster "${ECS_CLUSTER_NAME}" \
              --services "${ECS_SERVICE_NAME}" \
              --region "${AWS_DEFAULT_REGION}" \
              --query 'services[0].{ServiceName:serviceName,Status:status,RunningCount:runningCount,DesiredCount:desiredCount,TaskDefinition:taskDefinition,LastUpdated:updatedAt}'

            # Get and store new IP address if SECRETS_MANAGER_NAME is set
            if [ -n "$SECRETS_MANAGER_NAME" ]; then
              echo "=== Getting New ECS Task IP Address ==="
              
              TASK_ARNS=$(aws ecs list-tasks \
                --cluster "${ECS_CLUSTER_NAME}" \
                --service-name "${ECS_SERVICE_NAME}" \
                --region "${AWS_DEFAULT_REGION}" \
                --query 'taskArns[0]' \
                --output text)

              if [ "$TASK_ARNS" != "None" ] && [ -n "$TASK_ARNS" ]; then
                ENI_ID=$(aws ecs describe-tasks \
                  --cluster "${ECS_CLUSTER_NAME}" \
                  --tasks "$TASK_ARNS" \
                  --region "${AWS_DEFAULT_REGION}" \
                  --query 'tasks[0].attachments[0].details[?name==`networkInterfaceId`].value' \
                  --output text)

                if [ "$ENI_ID" != "None" ] && [ -n "$ENI_ID" ]; then
                  PUBLIC_IP=$(aws ec2 describe-network-interfaces \
                    --network-interface-ids "$ENI_ID" \
                    --region "${AWS_DEFAULT_REGION}" \
                    --query 'NetworkInterfaces[0].Association.PublicIp' \
                    --output text)

                  if [ "$PUBLIC_IP" != "None" ] && [ -n "$PUBLIC_IP" ]; then
                    # Install jq if not available
                    sudo apt-get update && sudo apt-get install -y jq

                    CURRENT_SECRET=$(aws secretsmanager get-secret-value \
                      --secret-id "${SECRETS_MANAGER_NAME}" \
                      --region "${AWS_DEFAULT_REGION}" \
                      --query 'SecretString' \
                      --output text 2>/dev/null || echo "{}")

                    TIMESTAMP=$(date -u '+%Y-%m-%d %H:%M:%S UTC')
                    
                    NEW_SECRET=$(echo "$CURRENT_SECRET" | jq --arg ip "$PUBLIC_IP" --arg ts "$TIMESTAMP" --arg sha "$CIRCLE_SHA1" '. + {api_ip_address_node: $ip, last_updated_node: $ts, deployment_source_node: "circleci", commit_sha_node: $sha}')

                    aws secretsmanager update-secret \
                      --secret-id "${SECRETS_MANAGER_NAME}" \
                      --secret-string "$NEW_SECRET" \
                      --region "${AWS_DEFAULT_REGION}" || \
                    aws secretsmanager create-secret \
                      --name "${SECRETS_MANAGER_NAME}" \
                      --description "API Configuration for Node.js API" \
                      --secret-string "$NEW_SECRET" \
                      --region "${AWS_DEFAULT_REGION}"

                    echo "✅ Successfully updated IP address in Secrets Manager"
                    echo "📍 New IP: $PUBLIC_IP"
                  fi
                fi
              fi
            fi

            echo "✅ Deployment verification complete"

workflows:
  build-test-deploy:
    jobs:
      # Stage 1: Install dependencies
      - install-deps

      # Stage 2: Quality checks (parallel, after deps installed)
      - lint-and-format:
          requires:
            - install-deps
      - test:
          requires:
            - install-deps
      - security-scan:
          requires:
            - install-deps

      # Stage 3: Build application
      - build:
          requires:
            - lint-and-format
            - test
            - security-scan

      # Stage 4: Build and scan Docker image (build once!)
      - docker-build-scan:
          requires:
            - build

      # Stage 5: Push pre-built image to ECR (only on main branch)
      - push-to-ecr:
          requires:
            - docker-build-scan
          filters:
            branches:
              only:
                - main
                - develop

      # Stage 6: Deploy to ECS (only on main branch, after successful ECR push)
      - deploy-to-ecs:
          requires:
            - push-to-ecr
          filters:
            branches:
              only:
                - main
